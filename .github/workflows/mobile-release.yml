# Publishes the Release Hub Android app to your hub's direct channel, so installed copies update
# themselves like any other app. Bump mobile/android/version.properties first: the hub refuses a
# versionCode it already has, and devices only update to a higher one.
#
# Keyless: the repo's GitHub Actions OIDC identity is exchanged for a 1-hour hub token scoped to
# this app, so no HUB_TOKEN secret is stored. Needs vars.RELEASE_HUB_URL and an OIDC grant on the
# hub (App → Configuration → Keyless publishing) for this repo's subject — with immutable subject
# claims (repos created after 2026-07-15) the prefix carries owner/repo IDs; copy it from
# Settings → Actions → OIDC configuration, then append :ref:refs/heads/main (default branch).
name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      slug:
        description: App slug on the hub
        default: release-hub
      notes:
        description: Release notes (shown as "What's new")
        default: ""

permissions:
  contents: read
  id-token: write # request the repo's OIDC token for the hub exchange

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUB_URL: ${{ vars.RELEASE_HUB_URL }}
      SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./mobile/.github/actions/setup-android

      - name: Exchange the job's OIDC token for a hub token
        run: |
          set -euo pipefail
          : "${HUB_URL:?RELEASE_HUB_URL repo variable is not set (Settings → Secrets and variables → Actions → Variables)}"
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json; api-version=2.0" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=release-hub" | jq -r .value)
          HUB_TOKEN=$(curl -fsS -X POST "$HUB_URL/api/oidc/exchange" \
            --data-urlencode "token=$oidc" | jq -r .token)
          echo "::add-mask::$HUB_TOKEN"
          echo "HUB_TOKEN=$HUB_TOKEN" >> "$GITHUB_ENV"

      - name: Fetch the signing key from the hub
        run: |
          set -euo pipefail
          curl -fsS -D "$RUNNER_TEMP/h" -H "Authorization: Bearer $HUB_TOKEN" \
            -o "$RUNNER_TEMP/release.jks" "$HUB_URL/api/apps/$SLUG/android/signing"
          header() { grep -i "^$1:" "$RUNNER_TEMP/h" | cut -d' ' -f2- | tr -d '\r'; }
          echo "$(header x-release-hub-keystore-sha256)  $RUNNER_TEMP/release.jks" | sha256sum -c
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEY_ALIAS=$(header x-release-hub-key-alias)"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$(header x-release-hub-store-password)"
          echo "::add-mask::$(header x-release-hub-key-password)"
          echo "RELEASE_STORE_PASSWORD=$(header x-release-hub-store-password)" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$(header x-release-hub-key-password)" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Upload to the hub's direct channel
        working-directory: mobile/android
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          . ./version.properties
          curl -fsS -H "Authorization: Bearer $HUB_TOKEN" \
            -F "file=@app/build/outputs/apk/release/app-release.apk" \
            -F channel=direct -F "versionCode=$VERSION_CODE" -F "versionName=$VERSION_NAME" -F "notes=$NOTES" \
            "$HUB_URL/api/apps/$SLUG/android/releases"
          rm -f "$RELEASE_STORE_FILE"
