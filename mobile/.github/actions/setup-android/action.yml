name: Set up Android build
description: JDK 21, Gradle cache (writes only from main) and CI Gradle properties.
runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: CI Gradle properties
      shell: bash
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties <<'PROPS'
        org.gradle.daemon=false
        org.gradle.workers.max=2
        kotlin.incremental=false
        PROPS
