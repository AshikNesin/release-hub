{{template "base.html" .}}
{{define "content"}}
<div class="box" style="max-width:400px;margin:64px auto">
  <h2>Welcome — set an admin password</h2>
  <form method="post" action="/setup">
    <label for="password">Password (min 8 chars)</label>
    <input type="password" id="password" name="password" style="width:100%" required>
    <label for="password2" style="margin-top:10px">Repeat</label>
    <input type="password" id="password2" name="password2" style="width:100%" required>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <button type="submit" style="width:100%;margin-top:12px">Save &amp; sign in</button>
  </form>
</div>
{{end}}
