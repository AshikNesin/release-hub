<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · release-hub</title>
<link rel="stylesheet" href="/static/{{.AssetVersion}}/style.css">
</head>
<body>
<header class="topnav">
  <a class="brand" href="/">release-hub</a>
  {{if .Authenticated}}<nav class="links">
    <a href="/" class="{{if eq .Title "Apps"}}active{{end}}">Apps</a>
    <a href="/settings" class="{{if eq .Title "Settings"}}active{{end}}">Settings</a>
    <a href="/logout">Log out</a>
  </nav>{{end}}
</header>
<main class="page">
  {{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
  {{block "content" .}}{{end}}
</main>
<script src="/static/{{.AssetVersion}}/app.js"></script>
</body>
</html>
