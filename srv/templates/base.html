{{define "nav"}}{{if .Authenticated}}<nav class="main">
  <a href="/" class="{{if eq .Title "Apps"}}active{{end}}">Apps</a>
  <a href="/settings" class="{{if eq .Title "Settings"}}active{{end}}">Settings</a>
  <a class="ghost" href="/logout">Logout</a>
</nav>{{end}}{{end}}
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · release-hub</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">R</span><a href="/">release-hub</a></div>
    {{template "nav" .}}
  </header>
  {{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
  {{block "content" .}}{{end}}
</div>
<script src="/static/app.js"></script>
</body>
</html>
