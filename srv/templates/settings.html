{{template "base.html" .}}
{{define "content"}}
<div class="pagehead">
  <h1>Settings</h1>
  <div class="sub">signing certificate subject used for newly generated keys</div>
</div>

<section>
  <div class="sect">Certificate subject</div>
  <p class="hint" style="margin:0 0 14px">Applies to newly generated keys only — existing keystores keep their certificate.</p>
  <form method="post" action="/settings" class="inline">
    {{range .Fields}}
    <div><label>{{.Label}}</label><input name="{{.Name}}" value="{{.Value}}" placeholder="{{.Hint}}"></div>
    {{end}}
    <button type="submit" class="btn primary">Save</button>
  </form>
</section>
{{end}}
