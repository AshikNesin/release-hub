{{template "base.html" .}}
{{define "content"}}
<div class="auth">
  <div class="card">
    <h1>release-hub</h1>
    <form method="post" action="/login">
      <label>Admin password</label>
      <input type="password" name="password" autofocus required>
      {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
      <button type="submit" class="btn primary">Sign in</button>
    </form>
  </div>
</div>
{{end}}
